<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI LeetCode Coach</title>
  <style>
    /* ---- Reset & Base ---- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #eff1f6;
      height: 100vh;
      overflow: hidden;
    }
    #root { height: 100%; }

    /* ---- Layout ---- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---- Header ---- */
    .header {
      padding: 12px 16px;
      background: #282828;
      border-bottom: 1px solid #3e3e3e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #ffa116;
    }
    .problem-tag {
      font-size: 11px;
      background: #353535;
      color: #9ca3af;
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* ---- Messages Area ---- */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #2a4a7f;
      color: #e0e7ff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #2a2a2a;
      color: #d4d4d4;
      border-bottom-left-radius: 4px;
    }
    .message.assistant pre {
      background: #1e1e1e;
      padding: 8px 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
    }
    .message.assistant code {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
    }
    .message.assistant p { margin: 6px 0; }
    .message.assistant ul, .message.assistant ol {
      padding-left: 18px;
      margin: 6px 0;
    }

    .thinking {
      color: #9ca3af;
      font-style: italic;
      font-size: 13px;
      padding: 8px 0;
    }
    .thinking::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* ---- Welcome ---- */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #9ca3af;
      gap: 8px;
    }
    .welcome .emoji { font-size: 40px; }
    .welcome h2 { color: #eff1f6; font-size: 16px; }
    .welcome p { font-size: 13px; line-height: 1.5; }

    /* ---- Input Area ---- */
    .input-area {
      padding: 12px 16px;
      background: #282828;
      border-top: 1px solid #3e3e3e;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #3e3e3e;
      background: #1a1a1a;
      color: #eff1f6;
      font-size: 13px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #ffa116;
    }
    .input-area button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #ffa116;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .input-area button:hover:not(:disabled) {
      background: #ffb340;
    }

    /* ---- Not on LeetCode banner ---- */
    .not-leetcode {
      background: #352a1a;
      color: #ffa116;
      padding: 8px 16px;
      font-size: 12px;
      text-align: center;
    }

    /* Scrollbar */
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #3e3e3e; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/App.jsx"></script>
</body>
</html>
